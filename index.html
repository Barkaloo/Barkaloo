<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#edf4ef">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Barkaloo">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <title>Barkaloo English</title>
  <style>html,body{margin:0;min-height:100%;background:#edf4ef;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#boot{min-height:100vh;display:grid;place-items:center;color:#405248;font-size:15px}#boot b{display:block;font-size:22px;margin-bottom:8px;color:#263a30}</style>
</head>
<body>
<div id="boot"><div><b>Barkaloo</b>Loading your English workspace…</div></div>
<script>
(async()=>{
  const files=[
    ...Array.from({length:11},(_,i)=>`app-${String(i).padStart(2,'0')}.b64`),
    'app-11a.b64','app-11b.b64','app-11c.b64','app-11d.b64','app-11e.b64','app-11f.b64','app-11g.b64','app-11h.b64'
  ];
  try{
    const parts=await Promise.all(files.map(async f=>{
      const r=await fetch('./'+f,{cache:'no-store'});
      if(!r.ok) throw new Error(`${f}: HTTP ${r.status}`);
      return (await r.text()).trim();
    }));
    const b64=parts.join('');
    const bin=atob(b64);
    const bytes=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    const html=await new Response(stream).text();
    document.open();document.write(html);document.close();
  }catch(err){
    console.error(err);
    document.getElementById('boot').innerHTML='<div><b>Barkaloo could not start</b>Reload the page. If this repeats, open the site once with an internet connection.</div>';
  }
})();
if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(console.error));}
</script>
</body>
</html>
