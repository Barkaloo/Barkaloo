<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#edf4ef">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Barkaloo">
  <title>Barkaloo English</title>
  <style>html,body{margin:0;min-height:100%;background:#edf4ef;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#boot{min-height:100vh;display:grid;place-items:center;color:#405248;font-size:15px}#boot b{display:block;font-size:22px;margin-bottom:8px;color:#263a30}</style>
</head>
<body>
<div id="boot"><div><b>Barkaloo</b>Loading your English workspace…</div></div>
<script>
(async()=>{
  const files=[...Array.from({length:11},(_,i)=>`app-${String(i).padStart(2,'0')}.b64`),'app-tail.b64'];
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
    }
    if('caches' in window){
      const keys=await caches.keys();
      await Promise.all(keys.map(k=>caches.delete(k)));
    }
    const parts=[];
    for(const f of files){
      const r=await fetch('./'+f+'?v=20261102-verified',{cache:'no-store'});
      if(!r.ok) throw new Error(`${f}: HTTP ${r.status}`);
      parts.push((await r.text()).replace(/\s+/g,''));
    }
    const b64=parts.join('');
    if(!/^[A-Za-z0-9+/]*={0,2}$/.test(b64)) throw new Error('archive contains invalid base64');
    const bin=atob(b64);
    const bytes=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    const html=await new Response(stream).text();
    if(!html.toLowerCase().includes('<!doctype html')) throw new Error('archive did not unpack to HTML');
    document.open();document.write(html);document.close();
  }catch(err){
    console.error(err);
    document.getElementById('boot').innerHTML='<div><b>Barkaloo could not start</b><br>'+String(err.message||err)+'</div>';
  }
})();
</script>
</body>
</html>
